<section class="formulario-contenedor">
<h2>Formulario de contacto</h2>
<p>Podés utilizar este formulario para realizar consultas, sugerir nuevos juegos o enviar una opinión sobre la ludoteca.</p>
<form action="#" method="post">
<label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" required>
<label for="email">Correo electrónico</label><input type="email" id="email" name="email" required>
<label for="mensaje">Mensaje</label><textarea id="mensaje" name="mensaje" rows="6" required></textarea>
<button type="submit">Enviar</button>
</form>
</section>
